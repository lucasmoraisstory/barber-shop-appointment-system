<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Studio Nail Design</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fff0f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        h2 { color: #ff69b4; text-align: center; margin-bottom: 20px; }
        label { font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 8px; margin: 8px 0 15px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; background-color: #ff69b4; color: white; padding: 10px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #ff1493; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Cadastro de Clientes</h2>
        <form id="cadastroForm" onsubmit="alert('Cliente cadastrado com sucesso!'); return false;">
            <label>Nome da Cliente:</label>
            <input type="text" placeholder="Digite o nome completo" required>
            
            <label>Telefone / WhatsApp:</label>
            <input type="tel" placeholder="(11) 99999-9999" required>
            
            <label>Serviço Desejado:</label>
            <select>
                <option>Alongamento em Gel</option>
                <option>Banho de Gel</option>
                <option>Esmaltação Semipermanente</option>
                <option>Manicure Simples</option>
            </select>
            
            <button type="submit">Agendar Cliente</button>
        </form>
    </div>
</body>
</html>
