<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - VIP Barber Shop</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #e0e0e0; }
        .container { background: #1e1e1e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 340px; border-top: 4px solid #d4af37; }
        h2 { color: #d4af37; text-align: center; margin-bottom: 25px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        label { font-weight: bold; color: #b3b3b3; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #333; border-radius: 4px; background-color: #2a2a2a; color: #fff; box-sizing: border-box; }
        input:focus, select:focus { border-color: #d4af37; outline: none; }
        button { width: 100%; background-color: #d4af37; color: #121212; padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: background 0.3s; }
        button:hover { background-color: #aa8c2c; }
    </style>
</head>
<body>
    <div class="container">
        <h2>VIP Barber Shop</h2>
        <form id="barberForm" onsubmit="alert('Agendamento realizado com sucesso!'); return false;">
            <label>Nome do Cliente:</label>
            <input type="text" placeholder="Digite seu nome completo" required>
            
            <label>Telefone / WhatsApp:</label>
            <input type="tel" placeholder="(11) 99999-9999" required>
            
            <label>Serviço Desejado:</label>
            <select>
                <option>Corte Degradê Moderno</option>
                <option>Barba Completa (Terapia)</option>
                <option>Combo: Cabelo + Barba</option>
                <option>Acabamento / Pezinho</option>
            </select>
            
            <button type="submit">Confirmar Agendamento</button>
        </form>
    </div>
</body>
</html>
